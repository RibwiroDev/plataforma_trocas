{% extends 'base.html' %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="page-shell">
    <div class="auth-card">
        <h2>Criar conta</h2>
        <p class="subtitle">Cadastre-se para começar a trocar itens na sua região.</p>

        <div class="avatar-picker">
            <div class="avatar-preview">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </div>
            <span class="avatar-meta">A foto de perfil é opcional e pode ser adicionada depois.</span>
        </div>

        <form method="post" enctype="multipart/form-data" class="styled-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
        <p class="switch-link">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
</div>
{% endblock %}
