{% extends 'base.html' %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<h2>Criar conta</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>
<p class="mt-3">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
