<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Plataforma de Trocas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Plataforma de Trocas</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-light me-3">Olá, {{ user.username }}</span>
                    <a href="{% url 'perfil' %}" class="btn btn-outline-light btn-sm me-2">Meu Perfil</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Sair</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Entrar</a>
                    <a href="{% url 'cadastro' %}" class="btn btn-light btn-sm">Cadastrar</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
